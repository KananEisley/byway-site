<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Byway</title>
  <meta name="description" content="The calm web. Pages, not feeds.">
  <style>
    :root { color-scheme: light dark; --paper: #fbf8f2; --ink: #23201b; --soft: #5d574d; }
    @media (prefers-color-scheme: dark) { :root { --paper: #1b1a17; --ink: #e8e3d8; --soft: #b3ac9f; } }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid; place-items: center; background: var(--paper); color: var(--ink);
      font-family: "Iowan Old Style", "Charter", Georgia, serif; text-align: center; padding: 2rem;
    }
    h1 { font-style: italic; font-weight: 600; font-size: 4rem; letter-spacing: -0.03em; margin: 0; }
    p { color: var(--soft); font-size: 1.25rem; margin: 0.75rem 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Byway</h1>
    <p>The calm web. Pages, not feeds. Coming soon.</p>
  </main>
</body>
</html>
